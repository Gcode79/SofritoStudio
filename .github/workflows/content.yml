name: Weekly Content Drop

# Sunday 10:00 UTC — generates a Journal post (rendered to public/blog/<slug>.html)
# + a batch of social captions, commits them to the repo, and (when configured)
# deploys the pivot Worker. NOTE: the content/queue markdown is git-ignored by
# design; only the *rendered* blog HTML is committed and deployed.
#
# Requires repo secrets (Settings > Secrets and variables > Actions):
#   OPENROUTER_API_KEY    (sk-or-... — model provider, same one the local 'npm run generate:*' uses)
#   CLOUDFLARE_API_TOKEN  (optional: Workers:Edit-scoped token used only by the deploy step)
#   CLOUDFLARE_ACCOUNT_ID (optional: b10d2ee39fa75abc3de1799de8903ebc — used only by the deploy step)

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-drop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pivot-site/package-lock.json

      - name: Install
        working-directory: pivot-site
        run: npm ci

      - name: Generate blog post (rendered HTML)
        working-directory: pivot-site
        run: node scripts/generate-blog-post.js "${{ vars.WEEKLY_TOPIC || '' }}" --emit

      - name: Generate social caption batch
        working-directory: pivot-site
        run: node scripts/generate-social-batch.js

      - name: Commit rendered content
        run: |
          git config user.name "Sofrito Content Bot"
          git config user.email "hello@sofritostudio.com"
          git add pivot-site/public/blog/ pivot-site/content/queue/.gitkeep
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore(content): weekly Journal + social drop $(date +%Y-%m-%d)"
            git push
          fi

      - name: Deploy Worker (when Cloudflare token secret is set)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: pivot-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy