name: Email Automation

# Schedules and runs the Sofrito Studio email flows as Buttondown broadcasts.
# You can also trigger this manually from the Actions tab (workflow_dispatch)
# with a specific flow + language.
#
# Requires repo secret: BUTTONDOWN_API_KEY
#
# NOTE: Emails broadcast to the whole list on the free plan, or a tag segment
# on the paid (Basic) plan. Use workflow_dispatch to run a flow on demand.

on:
  schedule:
    # Daily at 08:00 UTC — placeholder cadence; adjust to your rhythm.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      flow:
        description: 'Email flow to run'
        required: true
        default: 'lead_magnet'
        type: choice
        options:
          - lead_magnet
          - tripwire
          - onboarding
          - abandoned_cart
          - seasonal
      lang:
        description: 'Language'
        required: false
        default: 'en'
        type: choice
        options:
          - en
          - es
      holiday:
        description: 'Seasonal holiday (for flow=seasonal)'
        required: false
        default: 'navidad'
        type: choice
        options:
          - thanksgiving
          - navidad
          - san-sebastian

jobs:
  email-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install python-dotenv requests

      - name: Run email flow
        working-directory: buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          FLOW="${{ github.event.inputs.flow || 'lead_magnet' }}"
          LANG="${{ github.event.inputs.lang || 'en' }}"
          HOLIDAY="${{ github.event.inputs.holiday || 'navidad' }}"
          if [ "$FLOW" = "seasonal" ]; then
            python send_broadcast.py --flow "$FLOW" --lang "$LANG" --holiday "$HOLIDAY"
          else
            python send_broadcast.py --flow "$FLOW" --lang "$LANG"
          fi
