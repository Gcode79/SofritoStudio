name: opencode

# Runs OpenCode in GitHub Actions so that commenting `/opencode` (or `/oc`)
# on an issue auto-triages it, and `/opencode fix this` (or any implement/
# fix request) works on a new branch and opens a PR with the changes.
#
# Requires repo secrets:
#   OPENROUTER_API_KEY   (model provider used below — set to your provider's key)
#   + the opencode-agent GitHub App installed on this repo for OIDC token exchange.
#     (https://github.com/apps/opencode-agent)
#
# To instead run without the GitHub App, set `use_github_token: true` and pass
# GITHUB_TOKEN via env (granted by the `permissions` block below).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      # id-token is required for OIDC token exchange into the OpenCode App
      # installation; the write scopes let OpenCode create branches + PRs.
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/thinkingmachines/inkling
