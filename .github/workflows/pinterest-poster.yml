name: Pinterest Poster

# Publishes due pins from marketing/pins.json to the Pinterest board via the
# v5 API, then commits the updated pins.json so posted flags persist.
#
# Requires repo secrets (Settings > Secrets and variables > Actions):
#   PINTEREST_ACCESS_TOKEN  (regenerated WITH boards:write + pins:write scopes)
#   PINTEREST_BOARD_ID      (the "Boricua Recipes" board id from the board URL)

on:
  schedule:
    # 12:30 UTC daily — after the Meta poster so channels don't stack
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    # The queue-commit step pushes updated posted flags — without explicit
    # contents:write the default GITHUB_TOKEN is read-only and commits fail.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due pins
        working-directory: marketing
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python post_to_pinterest.py --publish

      - name: Commit updated pins.json
        run: |
          git config user.name "Marketing Bot"
          git config user.email "marketing@sofritostudio.com"
          git add marketing/pins.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(marketing): publish Pinterest pins"
            git push
          fi