name: Monthly Re-Engagement

# Sends a warm "still cooking?" email to past customers whose most recent
# purchase was 21-50 days ago (a fresh cohort each month). Runs on the 1st.
#
# Requires repo secrets:
#   GUMROAD_ACCESS_TOKEN
#   RESEND_API_KEY         (or Gmail creds as fallback)

on:
  schedule:
    # 1st of the month, 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  reengagement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run re-engagement
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          python mailer/reengagement.py