name: Social Poster

# Posts due content from marketing/content/queue.json to Instagram + Facebook
# via the Meta Graph API, then commits the updated queue so posted flags persist.
#
# Requires repo secrets:
#   META_ACCESS_TOKEN
#   META_PAGE_ID
#   META_INSTAGRAM_ACCOUNT_ID

on:
  schedule:
    # Daily 12:00 UTC (posts scheduled in queue.json)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to post (instagram, facebook, or empty for both)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run social publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ -n "$PLATFORM" ]; then
            python marketing/post_to_meta.py --publish --platform "$PLATFORM"
          else
            python marketing/post_to_meta.py --publish
          fi

      - name: Commit queue state
        run: |
          git config user.name "Social Bot"
          git config user.email "social@sofritostudio.com"
          git add marketing/content/queue.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(social): update content queue"
            git push
          fi