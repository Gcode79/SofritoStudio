name: Welcome Email

# Sends the welcome email to new subscribers via Gmail SMTP.
# Polls Buttondown for subscribers created in the last 20 minutes, then
# sends the personalized welcome (mailer/gmail_sender.py + templates).
#
# Requires repo secrets:
#   BUTTONDOWN_API_KEY      (subscriber lookup)
#   GMAIL_USER              (e.g. j.ortiz1148@gmail.com)
#   GMAIL_APP_PASSWORD      (Google Account > Security > App passwords)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send welcome to new subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
        run: |
          SUBS=$(curl -s "https://api.buttondown.com/v1/subscribers?ordering=-created_at&created_at_after=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            -H "Authorization: Token $BUTTONDOWN_API_KEY")

          echo "$SUBS" | jq -r '.results[] | .email_address' | while read EMAIL; do
            if [ -z "$EMAIL" ]; then continue; fi
            echo "Sending welcome to $EMAIL"
            python mailer/gmail_sender.py welcome "$EMAIL" || echo "  ! failed for $EMAIL"
          done