# ============================================================
# Sofrito Studio — Cloudflare Workers configuration (Wrangler)
#
# Single worker that OWNS sofritostudio.com:
#   - Serves the static site from deploy/ via the ASSETS binding
#   - Edge 301/302 redirects -> Gumroad checkout
#   - Recipe JSON-LD schema injection on static pages
#   - Webhooks: /gumroad/webhook (sales, sync) + /lead/webhook (leads) +
#     /api/webhook (sales, Queue-backed) + /api/events (funnel leads)
#
# Local test:
#   npx wrangler dev src/index.js --port 8787
#
# Deploy (publishes site + worker together):
#   npx wrangler deploy  (requires wrangler login or CF_API_TOKEN)
# ============================================================

name = "sofrito-edge"
main = "src/index.js"
compatibility_date = "2024-10-01"

# Serve the static site (deploy/) from the Worker. run_worker_first = true so
# edge transforms (recipe unlock CTAs, JSON-LD injection) run on every page.
# html_handling = "none" pairs with the canonical-URL compensator in
# src/index.js: .html URLs serve 200 directly (matching every canonical tag +
# sitemap entry — the platform default 307'd them to extensionless URLs),
# while "/" and legacy extensionless paths are handled worker-side.
# CHANGING ONE REQUIRES THE OTHER.
[assets]
directory = "../deploy"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Attach the worker to the Cloudflare Pages domain
[[routes]]
pattern = "sofritostudio.com"
custom_domain = true

# Set secrets with: npx wrangler secret put <NAME>
#   BUTTONDOWN_API_KEY
#   RESEND_API_KEY
#   GUMROAD_WEBHOOK_SECRET   (enable Gumroad webhook signature verification)
#   RESEND_WEBHOOK_SECRET    (Svix key for /api/webhooks/resend signature validation)
#   META_ACCESS_TOKEN        (CAPI Purchase/Lead events; falls back to META_CAPI_ACCESS_TOKEN)
#   GROQ_API_KEY             (chat widget LLM mode; absent = offline canned answers)
[vars]
RESEND_FROM = "hello@sofritostudio.com"
RESEND_FROM_NAME = "Sofrito Studio"
OWNER_EMAIL = "j.ortiz1148@gmail.com"
# Google Apps Script CRM endpoint — receives a POST per sale (order logs,
# revenue, timestamps). Set the deployed Apps Script web-app URL to enable.
GOOGLE_SCRIPT_URL = ""
# Meta Pixel ID — injected into the HTML <head> of every page so Meta's
# detector sees the pixel (a JS-file-only ID is invisible to Meta's crawler).
# Empty string = pixel fully off.
META_PIXEL_ID = "1080764457765905"
# Chat widget (/api/chat) — LLM mode. API key is a SECRET (GROQ_API_KEY);
# these tune which model/endpoint it calls. GROQ_BASE_URL can point at the AI
# Gateway. No key + no overrides = the widget runs in offline (built-in) mode.
GROQ_MODEL = "openai/gpt-oss-120b"
# GROQ_BASE_URL = "https://api.groq.com/openai/v1"
# DEV-ONLY regional preview: set DEBUG_REGION_OVERRIDE = "1" to enable
# ?debug_region=HI/NY/CA... AND ?debug_email=1|2|3 previews (NOT set in
# production — both triggers are inert without it).

# Durable state for email automation (leads, purchases, sent-flags)
[[kv_namespaces]]
binding = "SOFRITO_STATE"
id = "62a5f928b2b249b5bcf4d031c36f8611"

# Comment threads on recipe pages (YouTube-style, threaded replies)
[[d1_databases]]
binding = "DB"
database_name = "sofrito-comments"
database_id = "dc28d7b5-cb08-467d-b35e-2051a3c9267a"

# ------------------------------------------------------------------
# Async sale pipeline — POST /api/webhook validates the Gumroad signature,
# pushes the sale onto SOFRITO_QUEUE, and returns 200 immediately. The queue
# consumer (src/queue.js, wired as the `queue` export) fans each sale out to
# Meta CAPI, Buttondown tag surgery, Apps Script CRM, and a Resend exit event.
#
# Create the queue once before the first deploy (requires wrangler auth):
#   npx wrangler queues create sofrito-events-queue
# ------------------------------------------------------------------
[[queues.producers]]
binding = "SOFRITO_QUEUE"
queue = "sofrito-events-queue"

[[queues.consumers]]
queue = "sofrito-events-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Run the conversion-automation sweep hourly (abandoned checkout 1h/24h,
# post-purchase Day 3 upgrade + Day 14 review). Timings are relative to
# stored timestamps so an hourly tick is plenty.
[triggers]
crons = ["0 * * * *"]
