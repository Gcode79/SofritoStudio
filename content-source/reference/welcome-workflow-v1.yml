name: Welcome Email

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # manual trigger button

jobs:
  send-welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Send welcome emails to new subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          # Get subscribers added in the last 20 minutes (overlap to avoid misses)
          SUBS=$(curl -s "https://api.buttondown.com/v1/subscribers?ordering=-created_at&created_at_after=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            -H "Authorization: Buttondown $BUTTONDOWN_API_KEY")

          echo "$SUBS" | jq -r '.results[] | .email' | while read EMAIL; do
            if [ -n "$EMAIL" ]; then
              echo "Sending welcome to $EMAIL"

              curl -s -X POST "https://api.buttondown.com/v1/emails" \
                -H "Authorization: Buttondown $BUTTONDOWN_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(cat <<EOF
          {
            "body": "Hola! Welcome to Sofrito Studio.\n\nYour guide is ready:\n\n👉 Get Sofrito 101 — Master Your Base\nhttps://sofritostudio.com/freebies/Sofrito-101.pdf\n\nInside: the master sofrito recipe, every ingredient with mainland swaps, a 20-minute batch plan for a month of flavor, and troubleshooting.\n\nWhy start with sofrito? Because it's the base of almost every Boricua dish. Master it once, and mofongo, pernil, arroz con pollo, and coquito all get a step easier.\n\nWhen you're ready for more, here's what's cooking:\n\n- La Mesa Boricua — 30 essential recipes, bilingual ($47)\n- The Kitchen Bundle — cookbook + printable recipe cards & planners ($67)\n- The Full Table — the whole system, 30-minute dinners included ($97)\n- Mofongo & More — the video course, coming soon ($197)\n\n→ See everything\nhttps://sofritostudio.com/products.html\n\nBuen provecho,\n\n— The Ortiz family kitchen, Sofrito Studio",
            "subject": "Tu sofrito is on the way",
            "to": ["$EMAIL"]
          }
          EOF
          )"
            fi
          done
