<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <!-- Tablet frame -->
  <rect x="60" y="20" width="360" height="280" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="72" y="32" width="336" height="252" rx="4" fill="#faf6ee"/>
  
  <!-- Screen content: Cookbook spread -->
  <rect x="72" y="32" width="168" height="252" fill="#f5efe3"/>
  <rect x="80" y="44" width="152" height="100" rx="4" fill="#D94F3B" opacity="0.12"/>
  
  <!-- Left page: Recipe -->
  <text x="88" y="68" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2b2118">Sofrito Base</text>
  <text x="88" y="82" font-family="sans-serif" font-size="7" fill="#6b5d4f">The flavor foundation</text>
  <rect x="88" y="90" width="140" height="60" rx="3" fill="#C9962B" opacity="0.15"/>
  <text x="96" y="108" font-family="sans-serif" font-size="6" fill="#6b5d4f">1 bell pepper</text>
  <text x="96" y="118" font-family="sans-serif" font-size="6" fill="#6b5d4f">1 onion, quartered</text>
  <text x="96" y="128" font-family="sans-serif" font-size="6" fill="#6b5d4f">8 garlic cloves</text>
  <text x="96" y="138" font-family="sans-serif" font-size="6" fill="#6b5d4f">1 bunch culantro</text>
  
  <!-- Right page: Photo -->
  <rect x="244" y="44" width="152" height="120" rx="4" fill="#2A9D8F" opacity="0.12"/>
  <text x="252" y="70" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#2b2118">Arroz con Pollo</text>
  <text x="252" y="84" font-family="sans-serif" font-size="7" fill="#6b5d4f">30 min · One pot</text>
  <rect x="252" y="92" width="136" height="60" rx="3" fill="#2A9D8F" opacity="0.1"/>
  <text x="260" y="112" font-family="sans-serif" font-size="6" fill="#6b5d4f">Step 1: Sear chicken</text>
  <text x="260" y="122" font-family="sans-serif" font-size="6" fill="#6b5d4f">Step 2: Add sofrito</text>
  <text x="260" y="132" font-family="sans-serif" font-size="6" fill="#6b5d4f">Step 3: Rice + broth</text>
  
  <!-- Bottom bar -->
  <rect x="72" y="260" width="336" height="24" fill="#2b2118" rx="0"/>
  <text x="160" y="276" font-family="sans-serif" font-size="8" fill="#faf6ee" opacity="0.7">EN / ES — Bilingual</text>
  <circle cx="240" cy="272" r="3" fill="#D94F3B"/>
  <text x="250" y="276" font-family="sans-serif" font-size="8" fill="#faf6ee" opacity="0.7">30 Recipes</text>
  
  <!-- Floating phone mockup -->
  <rect x="320" y="200" width="100" height="180" rx="12" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <rect x="326" y="212" width="88" height="152" rx="3" fill="#faf6ee"/>
  <rect x="326" y="212" width="88" height="40" fill="#D94F3B" opacity="0.15"/>
  <text x="338" y="232" font-family="sans-serif" font-size="7" font-weight="bold" fill="#2b2118">La Mesa</text>
  <text x="338" y="242" font-family="sans-serif" font-size="6" fill="#6b5d4f">Boricua</text>
  <rect x="334" y="260" width="72" height="36" rx="3" fill="#C9962B" opacity="0.12"/>
  <text x="342" y="278" font-family="sans-serif" font-size="5" fill="#6b5d4f">Meal Planner</text>
  <rect x="334" y="302" width="72" height="36" rx="3" fill="#2A9D8F" opacity="0.12"/>
  <text x="342" y="320" font-family="sans-serif" font-size="5" fill="#6b5d4f">Shopping List</text>
  
  <!-- Subtle glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D94F3B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D94F3B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="240" cy="160" rx="200" ry="140" fill="url(#glow)"/>
</svg>