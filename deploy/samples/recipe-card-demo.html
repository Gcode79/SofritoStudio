<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Card Demo — Sofrito Studio</title>
  <meta name="description" content="Shoppable, bilingual Recipe Card component demo: serving scaler, unit switcher, ingredient checkboxes, print, and add-to-cart.">
  <link rel="canonical" href="https://sofritostudio.com/samples/recipe-card-demo.html">
  <link rel="alternate" hreflang="en" href="https://sofritostudio.com/samples/recipe-card-demo.html">
  <link rel="alternate" hreflang="es" href="https://sofritostudio.com/es/samples/recipe-card-demo.html">
  <link rel="alternate" hreflang="x-default" href="https://sofritostudio.com/samples/recipe-card-demo.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/recipe-card.css">
  <style>
    body { margin: 0; background: #f4ece0; color: #3a2f28; font-family: Inter, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #eadfcf; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-family: Fraunces, serif; font-size: 20px; font-weight: 700; color: #b02422; }
    .toolbar { display: flex; align-items: center; gap: 12px; }
    .lang-btn { background: #fff; border: 1px solid #3a2f28; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 7px 14px; }
    .lang-btn.is-active { background: #b02422; border-color: #b02422; color: #fff; }
    .cart-pill { background: #2e6b4f; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 14px; }
    main { padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .note { color: #7a6b5d; font-size: 13px; max-width: 720px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Sofrito Cocina Boricua</div>
    <div class="toolbar">
      <button class="lang-btn is-active" id="btn-en" data-lang="en">EN</button>
      <button class="lang-btn" id="btn-es" data-lang="es">ES</button>
      <span class="cart-pill" id="cart-count">0 in cart</span>
    </div>
  </header>

  <main>
    <p class="note">Demo of the reusable Recipe Card. Try the serving scaler, the US/Metric toggle, tick ingredients, then Print or Add to Cart. The JSON-LD in the head switches language with the toggle.</p>
    <div id="recipe-card"></div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/seo/jsonld.js"></script>
  <script src="../js/checkout.js"></script>
  <script src="../js/recipe-card.js"></script>
  <script>
    var SAMPLE_RECIPE = {
      "slug": "arroz-con-pollo",
      "name": { "en": "Arroz con Pollo (Yellow Chicken & Rice)", "es": "Arroz con Pollo" },
      "description": {
        "en": "The Sunday classic — yellow chicken and rice cooked in one pot, the way the Ortiz family makes it. Bilingual, mainland-tested.",
        "es": "El clásico de los domingos — arroz amarillo con pollo en una sola olla, como lo hace la familia Ortiz. Probado para la cocina del continente."
      },
      "image": [],
      "category": "Main Course",
      "keywords": "arroz con pollo, puerto rican rice, yellow rice, sofrito chicken",
      "datePublished": "2026-08-01",
      "prepTime": "PT20M",
      "cookTime": "PT25M",
      "totalTime": "PT45M",
      "servings": { "base": 6 },
      "yield": { "en": "6 servings", "es": "6 porciones" },
      "isAccessibleForFree": true,
      "cart": { "type": "gumroad", "url": "https://sofritostudio.gumroad.com/l/sofrito-starter-kit" },
      "ingredients": [
        {
          "gid": "base",
          "name": { "en": "The Base", "es": "La Base" },
          "items": [
            { "qty": 1, "unit": "cup", "name": { "en": "sofrito", "es": "sofrito" }, "metric": { "qty": 240, "unit": "ml" } },
            { "qty": 1, "unit": "tbsp", "name": { "en": "sazón", "es": "sazón" }, "metric": { "qty": 15, "unit": "ml" } }
          ]
        },
        {
          "gid": "proteins",
          "name": { "en": "Proteins", "es": "Proteínas" },
          "items": [
            { "qty": 2.5, "unit": "lb", "name": { "en": "bone-in chicken thighs", "es": "muslos de pollo con hueso" }, "metric": { "qty": 1135, "unit": "g" } },
            { "qty": 4, "unit": "cups", "name": { "en": "medium-grain rice", "es": "arroz de grano mediano" }, "metric": { "qty": 960, "unit": "ml" } }
          ]
        },
        {
          "gid": "aromatics",
          "name": { "en": "Aromatics", "es": "Aromáticos" },
          "items": [
            { "qty": 1, "unit": "head", "name": { "en": "garlic, minced", "es": "ajo, picado" } },
            { "qty": 1, "unit": "bunch", "name": { "en": "culantro", "es": "culantro" } },
            { "qty": 4, "unit": "cups", "name": { "en": "chicken broth", "es": "caldo de pollo" }, "metric": { "qty": 960, "unit": "ml" } }
          ]
        },
        {
          "gid": "garnish",
          "name": { "en": "To Finish", "es": "Para Terminar" },
          "items": [
            { "qty": 1, "unit": "can", "name": { "en": "green pigeon peas, drained", "es": "gandules verdes, escurridos" } },
            { "qty": 1, "unit": "bunch", "name": { "en": "cilantro, for garnish", "es": "cilantro, para decorar" } }
          ]
        }
      ],
      "steps": [
        { "en": "Heat oil in a large caldero over medium-high heat. Season the chicken with adobo and sear until golden on both sides, about 6 minutes.", "es": "Calienta aceite en un caldero grande a fuego medio-alto. Sazona el pollo con adobo y dóralo hasta que esté dorado por ambos lados, unos 6 minutos." },
        { "en": "Push the chicken to the edges. Add the sofrito and garlic, and cook 2 minutes until fragrant.", "es": "Empuja el pollo hacia los bordes. Añade el sofrito y el ajo, y cocina 2 minutos hasta que esté fragante." },
        { "en": "Stir in the rice and sazón, coating every grain. Pour in the broth and bring to a boil.", "es": "Añade el arroz y el sazón, cubriendo cada grano. Vierte el caldo y lleva a ebullición." },
        { "en": "Add the gandules, reduce to low, cover, and cook 20 minutes without lifting the lid.", "es": "Añade los gandules, baja el fuego, tapa y cocina 20 minutos sin levantar la tapa." },
        { "en": "Fluff the rice, rest 5 minutes, and garnish with cilantro.", "es": "Esponja el arroz, reposa 5 minutos y decora con cilantro." }
      ]
    };

    function injectSeo(lang) {
      document.querySelectorAll("script[data-sofrito-ld]").forEach(function (s) { s.remove(); });
      var graph = SofritoSeo.graph([
        SofritoSeo.recipe(SAMPLE_RECIPE, lang),
        SofritoSeo.howTo(SAMPLE_RECIPE, lang),
        SofritoSeo.product({
          sku: "starter-kit",
          name: { en: "Sofrito Starter Kit", es: "Kit de Inicio Sofrito" },
          description: { en: "The 5 essential Puerto Rican recipes, bilingual.", es: "Las 5 recetas esenciales puertorriqueñas, bilingüe." },
          image: [],
          price: 9,
          url: "https://sofritostudio.gumroad.com/l/sofrito-starter-kit",
          kind: "digital",
          inStock: true
        }, lang)
      ]);
      var el = SofritoSeo.inject(graph);
      el.setAttribute("data-sofrito-ld", "1");
    }

    document.addEventListener("DOMContentLoaded", function () {
      SofritoI18n.setLang("en");
      injectSeo("en");
      var card = new Sofrito.RecipeCard("#recipe-card", SAMPLE_RECIPE, { lang: "en" });

      function setLang(lang) {
        SofritoI18n.setLang(lang);
        injectSeo(lang);
        window.dispatchEvent(new CustomEvent("sofrito:lang"));
        document.getElementById("btn-en").classList.toggle("is-active", lang === "en");
        document.getElementById("btn-es").classList.toggle("is-active", lang === "es");
      }
      document.getElementById("btn-en").addEventListener("click", function () { setLang("en"); });
      document.getElementById("btn-es").addEventListener("click", function () { setLang("es"); });

      function renderCart() {
        document.getElementById("cart-count").textContent = SofritoCheckout.count() + " in cart";
      }
      window.addEventListener("sofrito:cart", renderCart);
      renderCart();
    });
  </script>
</body>
</html>
