<!doctype html>
<html>
<head><meta charset="utf-8"><title>Payment logged / Pago registrado</title></head>
<body style="margin:0;background:#F9FAFB;font-family:Arial,Helvetica,sans-serif;color:#0F172A;">
  <div style="max-width:600px;margin:0 auto;padding:24px;">
    <p style="font-family:Georgia,serif;font-size:20px;color:#0F172A;margin:0 0 20px;">Sofrito<span style="color:#EA580C;">Studio</span></p>
    <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:28px;">
      <h1 style="font-family:Georgia,serif;font-size:21px;color:#0F172A;margin:0 0 8px;">Payment logged</h1>
      <p style="font-size:15px;color:#334155;margin:0 0 16px;">A payment was recorded automatically via {{source}}.</p>
      <table style="width:100%;font-size:15px;color:#334155;border-collapse:collapse;">
        <tr><td style="padding:6px 0;color:#94A3B8;width:38%;">Amount</td><td style="padding:6px 0;"><strong style="font-size:20px;color:#0F172A;">${{amount}}</strong></td></tr>
        <tr><td style="padding:6px 0;color:#94A3B8;">Description</td><td style="padding:6px 0;">{{description}}</td></tr>
        <tr><td style="padding:6px 0;color:#94A3B8;">Source</td><td style="padding:6px 0;">{{source}}</td></tr>
      </table>
      <p style="font-size:13px;color:#64748B;margin:16px 0 0;">This is a system notice from your Sofrito Studio pipeline — no reply needed.</p>
    </div>
  </div>
</body>
</html>
