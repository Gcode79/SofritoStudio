<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofrito Studio</title>
  <meta name="description" content="Puerto Rican recipes, cookbooks, and kitchen systems.">
  <link rel="canonical" href="https://sofritostudio.com/products/product.html">
  <link rel="alternate" hreflang="en" href="https://sofritostudio.com/products/product.html">
  <link rel="alternate" hreflang="es" href="https://sofritostudio.com/es/products/product.html">
  <link rel="alternate" hreflang="x-default" href="https://sofritostudio.com/products/product.html">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Sofrito Studio">
  <meta property="og:title" content="Sofrito Studio">
  <meta property="og:description" content="Puerto Rican recipes, cookbooks, and kitchen systems.">
  <meta property="og:url" content="https://sofritostudio.com/products/product.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/product-page.css">
  <style>
    body { margin: 0; background: #f4ece0; color: #3a2f28; font-family: Inter, sans-serif; }
    .sitebar { background: #b02422; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; padding: 8px 16px; text-align: center; text-transform: uppercase; }
    .pp-nav { align-items: center; background: #fff; border-bottom: 1px solid #eadfcf; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; padding: 14px 20px; }
    .pp-brand { color: #b02422; font-family: Fraunces, serif; font-size: 21px; font-weight: 700; text-decoration: none; }
    .pp-navlinks { display: flex; flex-wrap: wrap; gap: 14px; }
    .pp-navlinks a { color: #3a2f28; font-size: 14px; font-weight: 600; text-decoration: none; }
    .pp-navlinks a:hover { color: #b02422; }
    .pp-lang { display: inline-flex; }
    .pp-lang button { background: #fff; border: 1px solid #3a2f28; cursor: pointer; font-size: 12px; font-weight: 700; padding: 6px 12px; }
    .pp-lang button:first-child { border-radius: 8px 0 0 8px; }
    .pp-lang button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
    .pp-lang button.is-active { background: #b02422; border-color: #b02422; color: #fff; }
    .pp-footer { background: #163527; color: #cfc3b5; padding: 30px 20px; text-align: center; }
    .pp-footer small { font-size: 13px; }
    .pp-notfound { padding: 60px 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="sitebar">Cocina Boricua &middot; Bilingual Recipes &amp; Kitchen Systems</div>

  <header class="pp-nav">
    <a class="pp-brand" href="../index.html">Sofrito Cocina Boricua</a>
    <nav class="pp-navlinks">
      <a href="../index.html">Home</a>
      <a href="../products.html">Products</a>
      <a href="../blog.html">Recipes</a>
      <a href="../about.html">About</a>
      <a href="../index.html#freebie">Free Sofrito 101</a>
    </nav>
    <div class="pp-lang">
      <button type="button" id="lang-en" class="is-active">EN</button>
      <button type="button" id="lang-es">ES</button>
    </div>
  </header>

  <main id="product-root"></main>

  <footer class="pp-footer">
    <small>&copy; <span id="year"></span> Sofrito — Cocina Boricua. Hecho con corazón y sofrito. All prices in USD.</small>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="../js/i18n.js"></script>
  <script src="../js/seo/jsonld.js"></script>
  <script src="../js/checkout.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/product-page.js"></script>
  <script>
    (function () {
      function param(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      var sku = param("sku") || "mesa";
      var stored = null;
      try { stored = localStorage.getItem("sofrito.lang"); } catch (e) {}
      var lang = stored === "es" ? "es" : "en";
      SofritoI18n.setLang(lang);

      function setLang(next) {
        SofritoI18n.setLang(next);
        document.getElementById("lang-en").classList.toggle("is-active", next === "en");
        document.getElementById("lang-es").classList.toggle("is-active", next === "es");
        window.dispatchEvent(new CustomEvent("sofrito:lang"));
      }
      document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
      document.getElementById("lang-es").addEventListener("click", function () { setLang("es"); });

      function boot() {
        SofritoCatalog.load("../data/products.json").then(function () {
          var product = SofritoCatalog.get(sku);
          var root = document.getElementById("product-root");
          if (!product) {
            root.innerHTML = "<div class='pp-notfound'><h2>Product not found</h2><p>Try one of the links in the catalog.</p></div>";
            return;
          }
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.href = "https://sofritostudio.com/products/" + product.sku + ".html";
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute("content", canonical.href);
          new Sofrito.ProductPage(root, product, { lang: SofritoI18n.getLang() });
        }).catch(function () {
          document.getElementById("product-root").innerHTML =
            "<div class='pp-notfound'><p>Catalog failed to load. Serve the site over HTTP (e.g. <code>python -m http.server</code>) and reload.</p></div>";
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
